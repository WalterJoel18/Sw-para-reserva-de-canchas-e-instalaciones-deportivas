<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso a la Plataforma - Birrias de One</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); padding: 20px;">

  <main style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <!-- Logo Superior -->
    <a href="index.html" class="logo-marca" style="margin-bottom: 24px; font-size: 1.35rem;">
      <span class="logo-icono" style="width: 44px; height: 44px;">
        <img src="img/iconos/iconologomarca.svg" alt="Birrias de One" width="26" height="26">
      </span>
      <span>Birrias de One</span>
    </a>

    <!-- Tarjeta Unificada de Acceso y Registro 100% CSS Puro -->
    <div class="login-card">
      
      <!-- Controles de Pestanas 100% CSS Puro -->
      <input type="radio" name="auth-tab" id="tab-radio-login" class="auth-radio" checked>
      <input type="radio" name="auth-tab" id="tab-radio-registro" class="auth-radio">

      <div class="auth-tab-labels">
        <label for="tab-radio-login" class="tab-label">Iniciar Sesión</label>
        <label for="tab-radio-registro" class="tab-label">Registrarse</label>
      </div>

      <!-- FORMULARIO 1: INICIAR SESION (6.1) -->
      <form id="form-login" class="auth-form-panel login-panel modal-cuerpo" action="catalogo.html" method="GET">
        <div>
          <label for="login-correo" class="form-label">Correo electrónico</label>
          <input type="email" id="login-correo" name="correo" required placeholder="ejemplo@correo.com" autocomplete="email" class="form-control">
        </div>

        <div>
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" id="login-password" name="password" required placeholder="••••••••" class="form-control">
        </div>

        <div style="display: flex; justify-content: flex-end; align-items: center;">
          <span style="color: var(--color-texto-muted); font-size: 0.8rem;">Demo pass: 123</span>
        </div>

        <button type="submit" class="btn-primario" style="padding: 12px; border-radius: 12px; width: 100%; margin-top: 6px;">
          Entrar a la plataforma
        </button>

        <!-- Accesos rápidos para evaluación de la profesora -->
        <div class="login-demo-box">
          <strong style="color: var(--color-primario); display: block; margin-bottom: 4px;">Cuentas de demostración preconfiguradas:</strong>
          <div>• <strong>Cliente:</strong> cliente@birrias.com / pass: 123 (<a href="catalogo.html" style="font-weight:600;">Entrar como Cliente</a>)</div>
          <div>• <strong>Administrador:</strong> admin@birrias.com / pass: 123 (<a href="admin.html" style="font-weight:600; color:#c62828;">Entrar como Admin</a>)</div>
        </div>
      </form>

      <!-- FORMULARIO 2: REGISTRO UNIFICADO (6.2) -->
      <form id="form-registro" class="auth-form-panel registro-panel modal-cuerpo" action="catalogo.html" method="GET" style="display: none;">
        <div>
          <label for="reg-nombre" class="form-label">Nombre completo</label>
          <input type="text" id="reg-nombre" name="nombre" required placeholder="Juan Pérez" autocomplete="name" class="form-control form-control-sm">
        </div>

        <div>
          <label for="reg-correo" class="form-label">Correo electrónico</label>
          <input type="email" id="reg-correo" name="correo" required placeholder="juan@correo.com" autocomplete="email" class="form-control form-control-sm">
        </div>

        <div>
          <label for="reg-telefono" class="form-label">Teléfono móvil</label>
          <input type="tel" id="reg-telefono" name="telefono" required placeholder="6351-6012" autocomplete="tel" class="form-control form-control-sm">
        </div>

        <div>
          <label for="reg-password" class="form-label">Contraseña</label>
          <input type="password" id="reg-password" name="password" required placeholder="••••••••" class="form-control form-control-sm">
        </div>

        <!-- Campo corporativo para elevar a Administrador (RF-01) -->
        <div class="login-corp-box">
          <label for="reg-codigo-corporativo" class="form-label">
            Código Corporativo (Opcional - Empleados UTP)
          </label>
          <input type="text" id="reg-codigo-corporativo" name="codigo" placeholder="Ingresa código si eres administrador" spellcheck="false" class="form-control form-control-sm">
          <small style="display: block; font-size: 0.72rem; color: var(--color-texto-muted); margin-top: 4px;">Código de prueba para perfil admin: <strong>UTP2026</strong></small>
        </div>

        <button type="submit" class="btn-primario" style="padding: 12px; border-radius: 12px; width: 100%; margin-top: 4px;">
          Crear cuenta
        </button>
      </form>

      <!-- //espacio para el link paa cuando creemos las cuentas -->
      <div style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
        <a href="index.html" style="color: var(--color-texto-muted); text-decoration: none;">Volver a la página principal</a>
      </div>

    </div>
  </main>
</body>
</html>
